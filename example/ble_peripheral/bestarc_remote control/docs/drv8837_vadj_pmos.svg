<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780">
  <defs>
    <style>
      .bg { fill: #fbfbf8; }
      .wire { stroke: #0f172a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #334155; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; }
      .pin { fill: #0f172a; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 2.4; rx: 10; }
      .note { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 8; }
      .ok { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 8; }
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #111827; }
      .label { font: 600 18px Arial, "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 500 15px Arial, "Microsoft YaHei", sans-serif; fill: #334155; }
      .tiny { font: 500 13px Arial, "Microsoft YaHei", sans-serif; fill: #475569; }
      .net { font: 700 16px Consolas, monospace; fill: #0369a1; }
      .value { font: 600 14px Consolas, monospace; fill: #7c2d12; }
      .ground { stroke: #0f172a; stroke-width: 2.4; }
      .red { stroke: #dc2626; }
      .blue { stroke: #2563eb; }
      .green { stroke: #059669; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1320" height="780"/>
  <text class="title" x="40" y="48">DRV8837 + P-MOS 线性可调 VM 电源方案</text>
  <text class="small" x="42" y="78">目标：PB03F 输出 PWM，经 MCP6001 控制高边 P-MOS，得到 1V-3V 的 VADJ；DRV8837 负责 50Hz 极性翻转。</text>

  <!-- PB03F / PWM filter -->
  <rect class="box" x="45" y="145" width="190" height="110"/>
  <text class="label" x="82" y="183">PB03F</text>
  <text class="small" x="72" y="214">P0 / BL_DAC</text>
  <circle class="pin" cx="235" cy="205" r="4"/>

  <line class="wire blue" x1="235" y1="205" x2="310" y2="205"/>
  <polyline class="thin" points="310,205 318,190 334,220 350,190 366,220 382,190 398,220 406,205"/>
  <text class="value" x="325" y="176">R1 10k</text>
  <line class="wire blue" x1="406" y1="205" x2="480" y2="205"/>
  <circle class="pin" cx="480" cy="205" r="4"/>
  <text class="net" x="450" y="190">VSET</text>

  <line class="wire" x1="480" y1="205" x2="480" y2="255"/>
  <line class="thin" x1="458" y1="255" x2="502" y2="255"/>
  <line class="thin" x1="458" y1="270" x2="502" y2="270"/>
  <line class="wire" x1="480" y1="270" x2="480" y2="320"/>
  <line class="ground" x1="455" y1="320" x2="505" y2="320"/>
  <line class="ground" x1="465" y1="332" x2="495" y2="332"/>
  <line class="ground" x1="475" y1="344" x2="485" y2="344"/>
  <text class="value" x="500" y="270">C1 1uF</text>
  <text class="tiny" x="418" y="365">R1/C1 低通：滤掉 P0 PWM，形成 0-3.3V 控制电压。</text>

  <!-- MCP6001 op amp -->
  <polygon class="box" points="570,150 570,300 725,225"/>
  <text class="label" x="592" y="144">U1 MCP6001</text>
  <text class="small" x="590" y="200">-</text>
  <text class="small" x="590" y="258">+</text>
  <line class="wire blue" x1="480" y1="205" x2="570" y2="200"/>
  <line class="wire green" x1="725" y1="225" x2="790" y2="225"/>
  <polyline class="thin" points="790,225 798,210 814,240 830,210 846,240 862,210 878,240 886,225"/>
  <text class="value" x="800" y="201">Rg 100Ω</text>
  <line class="wire green" x1="886" y1="225" x2="940" y2="225"/>
  <circle class="pin" cx="940" cy="225" r="4"/>
  <text class="net" x="910" y="207">GATE</text>

  <line class="wire" x1="570" y1="250" x2="540" y2="250"/>
  <line class="wire" x1="540" y1="250" x2="540" y2="455"/>
  <line class="wire" x1="540" y1="455" x2="965" y2="455"/>
  <circle class="pin" cx="965" cy="455" r="4"/>
  <text class="net" x="505" y="250">FB=VADJ</text>

  <!-- compensation -->
  <path class="dash" d="M655 162 C695 120, 775 125, 815 180"/>
  <line class="thin" x1="815" y1="180" x2="815" y2="210"/>
  <line class="thin" x1="803" y1="180" x2="827" y2="180"/>
  <line class="thin" x1="803" y1="170" x2="827" y2="170"/>
  <text class="value" x="690" y="116">Ccomp 100pF-1nF</text>
  <text class="tiny" x="652" y="135">可选：Gate 到 VADJ，抑制环路振荡</text>

  <!-- PMOS pass device -->
  <text class="label" x="910" y="125">Q1 P-MOS pass</text>
  <text class="value" x="910" y="148">AO3401A / IRLML6402 类</text>
  <line class="wire red" x1="965" y1="100" x2="965" y2="175"/>
  <text class="net" x="925" y="88">3V3_IN</text>
  <line class="wire red" x1="965" y1="175" x2="965" y2="455"/>
  <line class="thin" x1="940" y1="225" x2="940" y2="245"/>
  <line class="thin" x1="940" y1="245" x2="955" y2="245"/>
  <line class="thin" x1="955" y1="195" x2="955" y2="295"/>
  <line class="thin" x1="965" y1="215" x2="1005" y2="195"/>
  <line class="thin" x1="965" y1="275" x2="1005" y2="295"/>
  <path class="thin" d="M1000 200 L1000 290"/>
  <path class="thin" d="M1000 200 L990 218 M1000 200 L982 200"/>
  <text class="tiny" x="1010" y="190">S</text>
  <text class="tiny" x="1010" y="302">D</text>
  <text class="tiny" x="917" y="263">G</text>
  <text class="tiny" x="985" y="345">P-MOS 源极接 3V3，漏极输出 VADJ</text>

  <polyline class="thin" points="965,155 980,140 996,170 1012,140 1028,170 1044,140 1060,170 1075,155"/>
  <line class="thin" x1="1075" y1="155" x2="1075" y2="225"/>
  <line class="thin" x1="1075" y1="225" x2="940" y2="225"/>
  <text class="value" x="990" y="130">Rpull 100k</text>
  <text class="tiny" x="1082" y="165">上电默认关断</text>

  <text class="net" x="985" y="443">VADJ 1V-3V</text>
  <text class="small" x="995" y="470">给 DRV8837 VM</text>

  <!-- VADJ caps -->
  <line class="wire" x1="1050" y1="455" x2="1050" y2="520"/>
  <line class="thin" x1="1032" y1="520" x2="1068" y2="520"/>
  <line class="thin" x1="1032" y1="535" x2="1068" y2="535"/>
  <line class="wire" x1="1050" y1="535" x2="1050" y2="580"/>
  <line class="ground" x1="1025" y1="580" x2="1075" y2="580"/>
  <line class="ground" x1="1035" y1="592" x2="1065" y2="592"/>
  <line class="ground" x1="1045" y1="604" x2="1055" y2="604"/>
  <text class="value" x="1068" y="532">Cout 1uF + 100nF</text>
  <text class="tiny" x="1034" y="626">不要堆 30uF；先小电容验证稳定性</text>

  <line class="wire" x1="1115" y1="455" x2="1115" y2="505"/>
  <polyline class="thin" points="1115,505 1100,513 1130,529 1100,545 1130,561 1100,577 1115,585"/>
  <line class="wire" x1="1115" y1="585" x2="1115" y2="628"/>
  <line class="ground" x1="1090" y1="628" x2="1140" y2="628"/>
  <line class="ground" x1="1100" y1="640" x2="1130" y2="640"/>
  <line class="ground" x1="1110" y1="652" x2="1120" y2="652"/>
  <text class="value" x="1138" y="550">Rbleed 47k</text>

  <!-- DRV8837 -->
  <rect class="box" x="850" y="520" width="255" height="160"/>
  <text class="label" x="910" y="550">U2 DRV8837</text>
  <line class="wire red" x1="965" y1="455" x2="965" y2="520"/>
  <text class="net" x="928" y="512">VM</text>
  <line class="wire red" x1="1035" y1="490" x2="1035" y2="520"/>
  <text class="net" x="1002" y="486">VCC=3V3</text>
  <line class="wire" x1="890" y1="680" x2="890" y2="710"/>
  <line class="ground" x1="865" y1="710" x2="915" y2="710"/>
  <line class="ground" x1="875" y1="722" x2="905" y2="722"/>
  <line class="ground" x1="885" y1="734" x2="895" y2="734"/>

  <line class="wire blue" x1="710" y1="570" x2="850" y2="570"/>
  <line class="wire blue" x1="710" y1="610" x2="850" y2="610"/>
  <text class="net" x="665" y="575">P24 / IN1</text>
  <text class="net" x="665" y="615">P23 / IN2</text>

  <line class="wire green" x1="1105" y1="570" x2="1180" y2="570"/>
  <line class="wire green" x1="1105" y1="625" x2="1180" y2="625"/>
  <text class="net" x="1112" y="560">OUT1</text>
  <text class="net" x="1112" y="650">OUT2</text>

  <polyline class="thin" points="1180,570 1190,555 1205,585 1220,555 1235,585 1250,555 1265,585 1275,570"/>
  <text class="value" x="1188" y="540">Rs 10R-100R</text>
  <line class="wire green" x1="1275" y1="570" x2="1275" y2="625"/>
  <rect class="ok" x="1180" y="625" width="98" height="50"/>
  <text class="small" x="1192" y="655">EC 玻璃</text>

  <!-- Notes -->
  <rect class="note" x="45" y="430" width="415" height="210"/>
  <text class="label" x="68" y="462">设计要点</text>
  <text class="small" x="68" y="493">1. MCP6001 不直接给 VM 供电，只驱动 Q1 栅极。</text>
  <text class="small" x="68" y="523">2. Q1 选低 Vgs(th)、低 Rds(on) 的小 P-MOS。</text>
  <text class="small" x="68" y="553">3. VADJ 用 MCU PWM 占空比设定，范围建议钳位 1V-3V。</text>
  <text class="small" x="68" y="583">4. DRV8837 用 P23/P24 做 50Hz 互补控制。</text>
  <text class="small" x="68" y="613">5. 玻璃串 Rs 限制容性冲击电流，先从 47R 试。</text>

  <rect class="note" x="500" y="650" width="300" height="70"/>
  <text class="small" x="522" y="680">U1 极性：+IN 接 VADJ，-IN 接 VSET。</text>
  <text class="small" x="522" y="704">VADJ 偏低时，Gate 被拉低，Q1 导通。</text>

  <rect class="ok" x="500" y="515" width="300" height="122"/>
  <text class="label" x="522" y="548">推荐初值</text>
  <text class="small" x="522" y="578">R1=10k, C1=1uF</text>
  <text class="small" x="522" y="604">Rg=100Ω, Rpull=100k</text>
  <text class="small" x="522" y="630">Cout=1uF+100nF, Rbleed=47k, Rs=47R</text>

  <rect class="note" x="760" y="25" width="500" height="70"/>
  <text class="small" x="782" y="55">注意：这是线性调压，Q1 发热约为 (3.3V - VADJ) × Iload。</text>
  <text class="small" x="782" y="80">若玻璃平均电流超过 50-100mA，改用可调 buck/LDO 更稳。</text>
</svg>
